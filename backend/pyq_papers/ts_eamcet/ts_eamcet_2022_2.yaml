- id: 1
  section: Algebra
  topic: functions_and_inverse_functions
  text: |
    Let $\mathbb{R}$ be the set of all real numbers.
    Statement I : The function $f : (-\frac{\pi}{2}, \frac{\pi}{2}) \to \mathbb{R}$ defined by $f(x) = \sec x + \tan x$ is a one-one function.
    Statement II : The function $f : [0, \infty) \to \mathbb{R}$ defined by $f(x) = x^2$ is a one-one function.
    Which of the above statements is(are) true?
  options:
    A: Statement I is true, but Statement II is false
    B: Statement II is true, but Statement I is false
    C: Both Statement I and Statement II are true
    D: Both Statement I and Statement II are false
  correct_answer: C
  difficulty: moderate
  subject: Mathematics

