- id: 1
  section: Algebra
  topic: functions_and_inverse_functions
  text: "$f: [-2,2] ightarrow [-2,2]$, $g: [-2,2] ightarrow [0,4]$ are two functions\
    \ defined as $f(x) = \begin{cases} -2, & -2 \\leq x \\leq 0 \\ x^2-2, & 0 \\leq\
    \ x \\leq 2 \\end{cases}$ and $g(x) = |f(x)| + f(|x|)$, then"
  options:
    A: $f$ and $g$ are injective mappings
    B: $f$ and $g$ are surjective mappings
    C: $f$ is bijective mapping and $g$ is injective mapping
    D: $f$ is not bijective mapping and $g$ is surjective mapping
  correct_answer: A
  difficulty: moderate
  subject: Mathematics
