- id: 1
  section: Algebra
  topic: functions
  text: |
    If the function $f : \mathbb{R} \to \mathbb{R}$ is defined by
    $f(x) = \begin{cases} 2x-3, & \text{if } x < -2 \\ x^2-1, & \text{if } -2 \le x \le 2 \\ 3x+2, & \text{if } x > 2 \end{cases}$
    then $f$ is
  options:
    A: "an injection but not a surjection"
    B: "a surjection but not an injection"
    C: "a bijection"
    D: "neither injection nor surjection"
  correct_answer: D
  difficulty: moderate
  subject: Mathematics
