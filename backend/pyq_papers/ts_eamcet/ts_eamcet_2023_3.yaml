  options:
    A: "$(-\infty, 0) \cup (2, \infty)$"
    B: "$(2, \infty)$"
    C: "$(-\infty, 2) \cup (4, \infty)$"
    D: "$[4, \infty)$"
  correct_answer: D
  difficulty: hard
  subject: Mathematics
