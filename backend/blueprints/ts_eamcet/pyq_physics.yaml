- id: PYQ_PHY_MOD_01
  exam: TS_EAMCET
  subject: Physics
  unit: Modern Physics
  chapter: Atomic Physics
  concept: Hydrogen spectrum
  pyq_year: 2017

  template_variants:
    - "When hydrogen atom de-excites from n={n1} to n={n2}, find wavelength of emitted photon. [R = 1.097×10⁷ m⁻¹]"
    - "Calculate wavelength for transition from n={n1} to n={n2} in hydrogen. (R = 1.097×10⁷/m)"

  variables:
    n1:
      type: integer
      range: [3, 6]
    n2:
      type: integer
      range: [1, 2]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "1/λ = R(1/n2² - 1/n1²)"
  answer_unit: "nm"

  difficulty_level: moderate

  tags:
    - modern_physics
    - hydrogen_spectrum
    - rydberg_formula
    - pyq_2017

- id: PYQ_PHY_MOD_02
  exam: TS_EAMCET
  subject: Physics
  unit: Modern Physics
  chapter: Nuclear Physics
  concept: Nuclear sizes
  pyq_year: 2017

  template_variants:
    - "A nucleus disintegrates into two parts with velocities in ratio {v1}:{v2}. Find ratio of their nuclear sizes."
    - "Two nuclear fragments have velocity ratio {v1}:{v2}. Find their radius ratio."

  variables:
    v1:
      type: integer
      range: [1, 3]
    v2:
      type: integer
      range: [1, 2]

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "m1*v1 = m2*v2, R ∝ A^(1/3) ∝ m^(1/3), so R1/R2 = (v2/v1)^(1/3)"
  answer_type: ratio

  difficulty_level: moderate

  tags:
    - nuclear_physics
    - momentum_conservation
    - pyq_2017

# ============================================
# ELECTROSTATICS
# ============================================

- id: PYQ_PHY_ELEC_01
  exam: TS_EAMCET
  subject: Physics
  unit: Electrostatics
  chapter: Coulomb's Law
  concept: Force between charges

  template_variants:
    - "Two charges {q1} μC and {q2} μC are {r} cm apart. Find the force between them."
    - "Calculate electrostatic force: q₁ = {q1} μC, q₂ = {q2} μC, r = {r} cm."

  variables:
    q1:
      type: integer
      range: [1, 5]
    q2:
      type: integer
      range: [2, 6]
    r:
      type: integer
      range: [10, 30]
      step: 5

  constraints:
    steps: 2
    expected_time_sec: 50

  formula: "F = kq1q2/r² where k = 9×10⁹ Nm²/C²"
  answer_unit: "N"

  difficulty_level: easy

  tags:
    - electrostatics
    - coulombs_law
    - force

- id: PYQ_PHY_ELEC_02
  exam: TS_EAMCET
  subject: Physics
  unit: Electrostatics
  chapter: Electric Potential
  concept: Potential at a point

  template_variants:
    - "Find potential at {r} cm from a charge of {q} μC."
    - "Calculate electric potential at distance {r} cm from {q} μC charge."

  variables:
    q:
      type: integer
      range: [2, 10]
    r:
      type: integer
      range: [5, 20]
      step: 5

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "V = kq/r where k = 9×10⁹"
  answer_unit: "V"

  difficulty_level: easy

  tags:
    - electrostatics
    - potential

# ============================================
# CURRENT ELECTRICITY - From 2017 PYQ
# ============================================

- id: PYQ_PHY_CE_01
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Electric Power
  concept: Motor efficiency
  pyq_year: 2017

  template_variants:
    - "A motor fills an overhead tank at {h} m height at {rate} litres/hour. Motor resistance is {R} Ω connected to {V} V. Find efficiency. (g = 9.8 m/s²)"
    - "Electric motor pumps {rate} L/hr water to {h} m height. R = {R} Ω, V = {V} V. Calculate efficiency."

  variables:
    h:
      type: integer
      range: [15, 30]
      step: 5
    rate:
      type: integer
      range: [15000, 25000]
      step: 5000
    R:
      type: integer
      range: [20, 30]
      step: 2
    V:
      type: integer
      range: [200, 240]
      step: 20

  constraints:
    steps: 4
    expected_time_sec: 120

  formula: "η = (mgh/t)/(V²/R) = (ρ×vol×g×h/3600)/(V²/R)"
  answer_unit: "%"

  difficulty_level: hard

  tags:
    - current_electricity
    - power
    - efficiency
    - pyq_2017

- id: PYQ_PHY_CE_02
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Ohm's Law
  concept: Resistance calculation

  template_variants:
    - "A wire of resistance {R} Ω is stretched to {n} times its length. Find new resistance."
    - "If a {R} Ω wire is stretched to {n}× length, what is its resistance?"

  variables:
    R:
      type: integer
      range: [4, 20]
      step: 4
    n:
      type: integer
      range: [2, 4]

  constraints:
    steps: 2
    expected_time_sec: 45

  formula: "R' = n²R (since R ∝ l/A and volume constant)"
  answer_unit: "Ω"
  solution_template: "R' = {n}² × {R} = {answer} Ω"

  difficulty_level: easy

  tags:
    - current_electricity
    - resistance
    - stretching

