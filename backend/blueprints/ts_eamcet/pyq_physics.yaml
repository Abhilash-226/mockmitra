# TS EAMCET Physics - Blueprints from PYQ Papers
# Extracted from 2016-2024 Previous Year Questions

# ============================================
# UNITS AND MEASUREMENTS - From 2017 PYQ
# ============================================

- id: PYQ_PHY_UNIT_01
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Units and Measurements
  concept: Percentage error
  pyq_year: 2017

  template_variants:
    - "A physical quantity Q = a^{p}b^{q}/(c^{r}d^{s}). The percentage errors in a, b, c, d are {ea}%, {eb}%, {ec}%, {ed}% respectively. Find percentage error in Q."
    - "If Q = a^{p}b^{q}/(c^{r}d^{s}) with errors {ea}%, {eb}%, {ec}%, {ed}% in a, b, c, d, find error in Q."

  variables:
    p:
      type: integer
      range: [1, 3]
    q:
      type: integer
      range: [1, 3]
    r:
      type: integer
      range: [1, 2]
    s:
      type: integer
      range: [1, 2]
    ea:
      type: integer
      range: [1, 3]
    eb:
      type: integer
      range: [2, 4]
    ec:
      type: integer
      range: [3, 5]
    ed:
      type: integer
      range: [1, 3]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "ΔQ/Q × 100 = p(ea) + q(eb) + r(ec) + s(ed)"
  answer_unit: "%"
  solution_template: "Error = {p}×{ea} + {q}×{eb} + {r}×{ec} + {s}×{ed} = {answer}%"

  difficulty_level: moderate

  tags:
    - measurements
    - error_analysis
    - pyq_2017

# ============================================
# KINEMATICS - From 2017 PYQ
# ============================================

- id: PYQ_PHY_KIN_01
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Kinematics
  concept: Braking distance
  pyq_year: 2017

  template_variants:
    - "A train driver sees red signal {s} m ahead and applies brakes. With deceleration {a} m/s² and reaction time {t} s, find minimum speed to stop before signal."
    - "Driver applies brakes {s} m before signal. Deceleration = {a} m/s², reaction time = {t} s. Find maximum safe speed."

  variables:
    s:
      type: integer
      range: [30, 80]
      step: 10
    a:
      type: choice
      values: [5.0, 8.0, 10.0]
    t:
      type: choice
      values: [0.5, 0.75, 1.0]

  constraints:
    steps: 3
    expected_time_sec: 90

  formula: "s = v*t + v²/(2a), solve for v"
  answer_unit: "km/hr"
  difficulty_level: hard

  tags:
    - kinematics
    - braking
    - pyq_2017

- id: PYQ_PHY_KIN_02
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Kinematics
  concept: Free fall

  template_variants:
    - "A body is dropped from height {h} m. Find time to reach ground. (g = {g} m/s²)"
    - "Calculate time for free fall from {h} m height. (g = {g} m/s²)"

  variables:
    h:
      type: integer
      range: [20, 125]
      step: 5
    g:
      type: choice
      values: [10]

  constraints:
    steps: 2
    expected_time_sec: 45
    ensure_perfect_square_result: true

  formula: "t = √(2h/g)"
  answer_unit: "s"
  solution_template: "t = √(2×{h}/{g}) = √{result} = {answer} s"

  difficulty_level: easy

  tags:
    - kinematics
    - free_fall
    - equations_of_motion

- id: PYQ_PHY_KIN_03
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Kinematics
  concept: Projectile motion

  template_variants:
    - "A ball is thrown with velocity {u} m/s at angle {theta}° to horizontal. Find maximum height. (g = 10 m/s²)"
    - "Calculate max height for projectile with u = {u} m/s at θ = {theta}°."

  variables:
    u:
      type: integer
      range: [20, 50]
      step: 10
    theta:
      type: choice
      values: [30, 45, 60]

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "H = u²sin²θ/(2g)"
  answer_unit: "m"

  difficulty_level: easy

  tags:
    - kinematics
    - projectile_motion
    - maximum_height

# ============================================
# OPTICS - From 2017 PYQ
# ============================================

- id: PYQ_PHY_OPT_01
  exam: TS_EAMCET
  subject: Physics
  unit: Optics
  chapter: Refraction
  concept: Lens in liquid
  pyq_year: 2017

  template_variants:
    - "A thin bi-convex lens (n={nl}) has focal length {f} cm in air. When immersed in liquid, focal length becomes {fl} cm. Find refractive index of liquid."
    - "Lens (n={nl}) with f={f} cm in air has f={fl} cm in liquid. Find liquid's refractive index."

  variables:
    nl:
      type: choice
      values: [1.5]
    f:
      type: integer
      range: [20, 60]
      step: 10
    fl:
      type: integer
      range: [100, 300]
      step: 50

  constraints:
    steps: 3
    expected_time_sec: 90

  formula: "fl/f = (nl-1)/(nl/nm - 1), solve for nm"
  answer_type: numeric
  difficulty_level: hard

  tags:
    - optics
    - refraction
    - lens_formula
    - pyq_2017

- id: PYQ_PHY_OPT_02
  exam: TS_EAMCET
  subject: Physics
  unit: Optics
  chapter: Refraction
  concept: Lens maker formula

  template_variants:
    - "A convex lens of refractive index {n} has radii of curvature {R1} cm and {R2} cm. Find its focal length."
    - "Calculate focal length: n = {n}, R₁ = {R1} cm, R₂ = {R2} cm."

  variables:
    n:
      type: choice
      values: [1.5, 1.6]
    R1:
      type: integer
      range: [10, 30]
      step: 5
    R2:
      type: integer
      range: [15, 40]
      step: 5

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "1/f = (n-1)(1/R1 + 1/R2)"
  answer_unit: "cm"

  difficulty_level: moderate

  tags:
    - optics
    - lens_maker
    - focal_length

# ============================================
