- id: PYQ_PHY_THERMO_02
  exam: TS_EAMCET
  subject: Physics
  unit: Thermodynamics
  chapter: Heat Transfer
  concept: Specific heat

  template_variants:
    - "Calculate heat required to raise temperature of {m} kg water from {t1}°C to {t2}°C. (c = 4200 J/kg·K)"
    - "Find Q to heat {m} kg water from {t1}°C to {t2}°C."

  variables:
    m:
      type: integer
      range: [1, 5]
    t1:
      type: integer
      range: [20, 30]
      step: 5
    t2:
      type: integer
      range: [60, 100]
      step: 10

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "Q = mcΔT = m × 4200 × (t2 - t1)"
  answer_unit: "J"
  solution_template: "Q = {m} × 4200 × ({t2} - {t1}) = {answer} J"

  difficulty_level: easy

  tags:
    - thermodynamics
    - heat
    - specific_heat
