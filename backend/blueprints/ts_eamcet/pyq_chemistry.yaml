# ============================================
# SOLUTIONS - From 2017 PYQ
# ============================================

- id: PYQ_CHEM_SOL_01
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Solutions
  concept: Molarity calculation
  pyq_year: 2017

  template_variants:
    - "{mass} g of {compound} (M = {molar_mass}) is dissolved to make {volume} mL solution. Find molarity."
    - "Calculate molarity: {mass} g {compound} in {volume} mL solution."

  variables:
    mass:
      type: integer
      range: [10, 50]
      step: 5
    compound:
      type: choice
      values:
        - "NaOH"
        - "HCl"
        - "H₂SO₄"
        - "NaCl"
    molar_mass:
      type: choice
      values:
        - 40
        - 36.5
        - 98
        - 58.5
    volume:
      type: integer
      range: [250, 1000]
      step: 250

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "M = (mass/molar_mass) × (1000/volume)"
  answer_unit: "M"
  solution_template: "M = ({mass}/{molar_mass}) × (1000/{volume}) = {answer} M"

  difficulty_level: easy

  tags:
    - solutions
    - molarity
    - pyq_2017

- id: PYQ_CHEM_SOL_02
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Solutions
  concept: Molality

  template_variants:
    - "{mass} g of {solute} is dissolved in {solvent_mass} g of water. Find molality."
    - "Calculate molality: {mass} g solute (M = {molar_mass}) in {solvent_mass} g water."

  variables:
    mass:
      type: integer
      range: [5, 30]
      step: 5
    solute:
      type: choice
      values: ["NaCl", "KCl", "glucose"]
    molar_mass:
      type: choice
      values: [58.5, 74.5, 180]
    solvent_mass:
      type: integer
      range: [100, 500]
      step: 100

  constraints:
    steps: 2
    expected_time_sec: 50

  formula: "m = (mass/molar_mass) × (1000/solvent_mass)"
  answer_unit: "m"

  difficulty_level: easy

  tags:
    - solutions
    - molality
    - concentration

