# ============================================
# THERMODYNAMICS
# ============================================

- id: PYQ_CHEM_THERMO_01
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Thermodynamics
  concept: Enthalpy change

  template_variants:
    - "For reaction A → B, ΔH = {dh} kJ/mol at {t1}°C. Find ΔH at {t2}°C. [Cp(B) - Cp(A) = {dcp} J/mol·K]"
    - "Calculate enthalpy change at new temperature using Kirchhoff's equation."

  variables:
    dh:
      type: integer
      range: [-50, -10]
      step: 5
    t1:
      type: integer
      range: [25, 30]
    t2:
      type: integer
      range: [50, 100]
      step: 25
    dcp:
      type: integer
      range: [10, 50]
      step: 10

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "ΔH₂ = ΔH₁ + ΔCp(T₂ - T₁)"
  answer_unit: "kJ/mol"

  difficulty_level: moderate

  tags:
    - thermodynamics
    - enthalpy
    - kirchhoff

- id: PYQ_CHEM_THERMO_02
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Thermodynamics
  concept: Gibbs free energy

  template_variants:
    - "For a reaction, ΔH = {dh} kJ and ΔS = {ds} J/K at {t} K. Find ΔG."
    - "Calculate ΔG at {t} K: ΔH = {dh} kJ, ΔS = {ds} J/K."

  variables:
    dh:
      type: integer
      range: [-100, -20]
      step: 10
    ds:
      type: integer
      range: [-200, 200]
      step: 50
    t:
      type: choice
      values: [298, 300, 400]

  constraints:
    steps: 2
    expected_time_sec: 50

  formula: "ΔG = ΔH - TΔS"
  answer_unit: "kJ"

  difficulty_level: easy

  tags:
    - thermodynamics
    - gibbs_energy
    - spontaneity

# ============================================
# CHEMICAL KINETICS
# ============================================

- id: PYQ_CHEM_KIN_01
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Chemical Kinetics
  concept: Half-life

  template_variants:
    - "For first order reaction with k = {k} s⁻¹, find half-life."
    - "Calculate t₁/₂ for first order: k = {k} s⁻¹."

  variables:
    k:
      type: choice
      values:
        - 0.01
        - 0.02
        - 0.05
        - 0.1

  constraints:
    steps: 1
    expected_time_sec: 30

  formula: "t₁/₂ = 0.693/k"
  answer_unit: "s"
  solution_template: "t₁/₂ = 0.693/{k} = {answer} s"

  difficulty_level: easy

  tags:
    - kinetics
    - half_life
    - first_order

- id: PYQ_CHEM_KIN_02
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Chemical Kinetics
  concept: Rate law

  template_variants:
    - "For 2A + B → C, rate = k[A]²[B]. If [A] is doubled and [B] is halved, how does rate change?"
    - "Rate = k[A]ⁿ[B]ᵐ. Find rate change when concentrations are modified."

  variables:
    n:
      type: integer
      range: [1, 2]
    m:
      type: integer
      range: [1, 2]
    factor_a:
      type: integer
      range: [2, 3]
    factor_b:
      type: choice
      values: [0.5, 1, 2]

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "new rate = original × (factor_a)^n × (factor_b)^m"
  answer_type: numeric

  difficulty_level: moderate

  tags:
    - kinetics
    - rate_law

# ============================================
# ELECTROCHEMISTRY
# ============================================

- id: PYQ_CHEM_ELEC_01
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Electrochemistry
  concept: Cell EMF

  template_variants:
    - "For cell Zn|Zn²⁺||Cu²⁺|Cu, E°(Zn²⁺/Zn) = {e_zn} V, E°(Cu²⁺/Cu) = {e_cu} V. Find E°cell."
    - "Calculate standard EMF: E°(cathode) = {e_cu} V, E°(anode) = {e_zn} V."

  variables:
    e_zn:
      type: choice
      values: [-0.76]
    e_cu:
      type: choice
      values: [0.34]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "E°cell = E°cathode - E°anode"
  answer_unit: "V"
  solution_template: "E°cell = {e_cu} - ({e_zn}) = {answer} V"

  difficulty_level: easy

  tags:
    - electrochemistry
    - emf
    - galvanic_cell

- id: PYQ_CHEM_ELEC_02
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Electrochemistry
  concept: Nernst equation

  template_variants:
    - "For cell with E° = {e_std} V, find E when [oxidized]/[reduced] = {ratio} at 298 K."
    - "Apply Nernst equation: E° = {e_std} V, concentration ratio = {ratio}."

  variables:
    e_std:
      type: choice
      values: [1.10, 0.76, 0.34]
    ratio:
      type: choice
      values: [10, 100, 0.1, 0.01]
    n:
      type: integer
      range: [2, 3]

  constraints:
    steps: 2
    expected_time_sec: 65

  formula: "E = E° - (0.059/n)log(Q)"
  answer_unit: "V"

  difficulty_level: moderate

  tags:
    - electrochemistry
    - nernst_equation

