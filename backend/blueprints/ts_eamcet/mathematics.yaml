# ============================================
# UNIT 3: VECTOR ALGEBRA
# ============================================

- id: MATH_VEC_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Vector Algebra
  chapter: Vectors
  concept: Magnitude

  template_variants:
    - "Find the magnitude of the vector {a}i + {b}j."
    - "Evaluate |{a}i + {b}j|."
    - "Calculate the length of vector v = {a}i + {b}j."

  variables:
    a:
      type: integer
      range: [3, 8]
    b:
      type: integer
      range: [3, 8]

  constraints:
    steps: 1
    expected_time_sec: 40
    ensure_perfect_square_sum: true

  formula: "|v| = √(a² + b²)"
  answer_unit: dimensionless
  solution_template: "|v| = √({a}² + {b}²) = √({a_sq} + {b_sq}) = √{sum} = {answer}"

  difficulty_level: easy

  options:
    count: 4
    distractor_strategy:
      - formula: "a + b"
        error_type: simple_addition
      - formula: "a² + b²"
        error_type: forgot_sqrt
      - formula: "√(a² - b²)"
        error_type: subtraction_error

  tags:
    - vectors
    - magnitude

- id: MATH_VEC_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Vector Algebra
  chapter: Scalar Product
  concept: Dot product

  template_variants:
    - "Find the dot product of vectors a = {a1}i + {a2}j and b = {b1}i + {b2}j."
    - "Calculate a · b where a = {a1}i + {a2}j and b = {b1}i + {b2}j."

  variables:
    a1:
      type: integer
      range: [1, 5]
    a2:
      type: integer
      range: [1, 5]
    b1:
      type: integer
      range: [1, 5]
    b2:
      type: integer
      range: [1, 5]

  constraints:
    steps: 1
    expected_time_sec: 45

  formula: "a · b = a1×b1 + a2×b2"
  answer_unit: dimensionless
  solution_template: "a · b = ({a1})({b1}) + ({a2})({b2}) = {prod1} + {prod2} = {answer}"

  difficulty_level: easy

  tags:
    - vectors
    - dot_product

- id: MATH_VEC_03
  exam: TS_EAMCET
  subject: Mathematics
  unit: Vector Algebra
  chapter: Cross Product
  concept: Cross product 2D

  template_variants:
    - "Find |a × b| where a = {a1}i + {a2}j and b = {b1}i + {b2}j."
    - "Calculate the magnitude of cross product of a = {a1}i + {a2}j and b = {b1}i + {b2}j."

  variables:
    a1:
      type: integer
      range: [1, 4]
    a2:
      type: integer
      range: [1, 4]
    b1:
      type: integer
      range: [1, 4]
    b2:
      type: integer
      range: [1, 4]

  constraints:
    steps: 1
    expected_time_sec: 50

  formula: "|a × b| = |a1×b2 - a2×b1|"
  answer_unit: dimensionless
  solution_template: "|a × b| = |({a1})({b2}) - ({a2})({b1})| = |{prod1} - {prod2}| = {answer}"

  difficulty_level: easy

  tags:
    - vectors
    - cross_product

# ============================================
# UNIT 4: COORDINATE GEOMETRY
# ============================================

- id: MATH_CG_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Straight Lines
  concept: Distance formula

  template_variants:
    - "Find the distance between points ({x1}, {y1}) and ({x2}, {y2})."
    - "Calculate the length of line segment joining ({x1}, {y1}) and ({x2}, {y2})."

  variables:
    point_pairs:
      type: choice
      values:
        - { x1: 0, y1: 0, x2: 3, y2: 4, answer: 5 }
        - { x1: 1, y1: 2, x2: 4, y2: 6, answer: 5 }
        - { x1: -1, y1: 2, x2: 2, y2: 6, answer: 5 }
        - { x1: 0, y1: 0, x2: 5, y2: 12, answer: 13 }
        - { x1: 2, y1: 1, x2: 10, y2: 7, answer: 10 }
        - { x1: -3, y1: 0, x2: 0, y2: 4, answer: 5 }

  constraints:
    steps: 1
    expected_time_sec: 45
    ensure_perfect_square_result: true

  formula: "d = √[(x2-x1)² + (y2-y1)²]"
  answer_unit: units
  solution_template: "d = √[({x2}-{x1})² + ({y2}-{y1})²] = √[{dx}² + {dy}²] = √{sum} = {answer}"

  difficulty_level: easy

  options:
    count: 4
    distractor_strategy:
      - formula: "|x2-x1| + |y2-y1|"
        error_type: manhattan_distance
      - formula: "√(x2² + y2²)"
        error_type: forgot_subtraction
      - formula: "(x2-x1)² + (y2-y1)²"
        error_type: forgot_sqrt

  tags:
    - coordinate_geometry
    - distance

- id: MATH_CG_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Circle
  concept: Standard equation

  template_variants:
    - "Find the equation of a circle with center ({h}, {k}) and radius {r}."
    - "Write the equation of circle having center ({h}, {k}) and radius {r}."

  variables:
    h:
      type: integer
      range: [-3, 3]
    k:
      type: integer
      range: [-3, 3]
    r:
      type: integer
      range: [2, 5]

  constraints:
    steps: 1
    expected_time_sec: 50

  formula: "(x-h)² + (y-k)² = r²"
  answer_type: expression
  solution_template: "(x-{h})² + (y-{k})² = {r}² = {r_sq}"

  difficulty_level: easy

  tags:
    - circle
    - equation

- id: MATH_CG_03
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Straight Lines
  concept: Slope

  template_variants:
    - "Find the slope of the line passing through ({x1}, {y1}) and ({x2}, {y2})."
    - "Calculate the gradient of line joining ({x1}, {y1}) and ({x2}, {y2})."

  variables:
    x1:
      type: integer
      range: [-4, 4]
    y1:
      type: integer
      range: [-4, 4]
    x2:
      type: integer
      range: [-4, 4]
    y2:
      type: integer
      range: [-4, 4]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "m = (y2-y1)/(x2-x1)"
  answer_unit: dimensionless
  solution_template: "m = ({y2}-{y1})/({x2}-{x1}) = {dy}/{dx} = {answer}"

  difficulty_level: easy

  tags:
    - straight_lines
    - slope

- id: MATH_CG_04
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Parabola
  concept: Focus

  template_variants:
    - "Find the focus of the parabola y² = {four_a}x."
    - "Determine the focus of y² = {four_a}x."

  variables:
    four_a:
      type: integer
      range: [4, 20]
      step: 4

  constraints:
    steps: 1
    expected_time_sec: 45

  formula: "Focus = (a, 0) where 4a = {four_a}"
  answer_type: coordinate
  solution_template: "4a = {four_a}, so a = {a}. Focus = ({a}, 0)"

  difficulty_level: easy

  tags:
    - parabola
    - conic_sections

- id: MATH_CG_05
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Ellipse
  concept: Eccentricity

  template_variants:
    - "Find the eccentricity of the ellipse x²/{a_sq} + y²/{b_sq} = 1."
    - "Calculate e for the ellipse x²/{a_sq} + y²/{b_sq} = 1."

  variables:
    a_sq:
      type: choice
      values: [25, 16, 9]
    b_sq:
      type: choice
      values: [9, 4, 16]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "e = √(1 - b²/a²)"
  answer_unit: dimensionless
  solution_template: "a² = {a_sq}, b² = {b_sq}. e = √(1 - {b_sq}/{a_sq}) = √({result}) = {answer}"

  difficulty_level: moderate

  tags:
    - ellipse
    - eccentricity

