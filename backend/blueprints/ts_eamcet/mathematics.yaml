# TS EAMCET Mathematics Blueprints
# Comprehensive blueprint collection for question generation

# ============================================
# UNIT 1: ALGEBRA
# ============================================

- id: MATH_ALG_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Functions
  concept: Function evaluation

  template_variants:
    - "If f(x) = {expr}, find f({val})."
    - "Evaluate f({val}) for the function f(x) = {expr}."
    - "For f(x) = {expr}, calculate f({val})."

  variables:
    expr:
      type: choice
      values:
        - "2x + 3"
        - "x² - 1"
        - "3x - 5"
        - "x² + 2x"
        - "2x² - 3"
    val:
      type: integer
      range: [-3, 5]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "Substitute x = {val} in {expr}"
  answer_unit: dimensionless
  solution_template: "f({val}) = {expr} where x = {val} = {answer}"

  difficulty_level: easy
  difficulty_factors:
    - direct_substitution
    - single_step

  options:
    count: 4
    distractor_strategy:
      - formula: "f({val}) + 1"
        error_type: off_by_one
      - formula: "f({val} + 1)"
        error_type: wrong_substitution
      - formula: "f(-{val})"
        error_type: sign_error

  tags:
    - functions
    - substitution
    - algebra

- id: MATH_ALG_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Inverse Functions
  concept: Finding inverse

  template_variants:
    - "Find the inverse of the function f(x) = {a}x + {b}."
    - "Determine f⁻¹(x) if f(x) = {a}x + {b}."
    - "If f(x) = {a}x + {b}, find f⁻¹(x)."

  variables:
    a:
      type: integer
      range: [2, 5]
    b:
      type: integer
      range: [-4, 4]
      exclude: [0]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "f⁻¹(x) = (x - {b}) / {a}"
  answer_unit: dimensionless
  answer_type: expression
  solution_template: "Let y = {a}x + {b}. Solve for x: x = (y - {b})/{a}. So f⁻¹(x) = (x - {b})/{a}"

  difficulty_level: easy
  difficulty_factors:
    - linear_function
    - algebraic_manipulation

  options:
    count: 4
    distractor_strategy:
      - formula: "(x + {b}) / {a}"
        error_type: sign_error
      - formula: "{a}x - {b}"
        error_type: not_inverse
      - formula: "x / {a} - {b}"
        error_type: order_error

  tags:
    - inverse_function
    - linear

- id: MATH_ALG_03
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Complex Numbers
  concept: Modulus

  template_variants:
    - "Find the modulus of the complex number {a} + {b}i."
    - "Evaluate |{a} + {b}i|."
    - "Calculate the absolute value of z = {a} + {b}i."

  variables:
    a:
      type: integer
      range: [-5, 5]
      exclude: [0]
    b:
      type: integer
      range: [-5, 5]
      exclude: [0]

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_perfect_square_sum: true

  formula: "|z| = √(a² + b²)"
  answer_unit: dimensionless
  solution_template: "|z| = √({a}² + {b}²) = √({a_sq} + {b_sq}) = √{sum} = {answer}"

  difficulty_level: easy
  difficulty_factors:
    - single_formula
    - basic_arithmetic

  options:
    count: 4
    distractor_strategy:
      - formula: "a + b"
        error_type: added_instead_of_sqrt
      - formula: "√(a² - b²)"
        error_type: subtracted_instead
      - formula: "a² + b²"
        error_type: forgot_sqrt

  tags:
    - complex_numbers
    - modulus

- id: MATH_ALG_04
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Quadratic Equations
  concept: Nature of roots

  template_variants:
    - "Find the nature of roots of the equation x² + {a}x + {b} = 0."
    - "Determine whether the roots of x² + {a}x + {b} = 0 are real or imaginary."
    - "What is the nature of roots for x² + {a}x + {b} = 0?"

  variables:
    a:
      type: integer
      range: [-6, 6]
    b:
      type: integer
      range: [-10, 10]

  constraints:
    steps: 1
    expected_time_sec: 45

  formula: "D = a² - 4b"
  answer_type: categorical
  answer_options:
    - "Real and Distinct (D > 0)"
    - "Real and Equal (D = 0)"
    - "Imaginary (D < 0)"
  solution_template: "D = ({a})² - 4(1)({b}) = {a_sq} - {four_b} = {D}. Since D {comparison} 0, roots are {answer}."

  difficulty_level: easy
  difficulty_factors:
    - discriminant
    - single_calculation

  tags:
    - quadratic
    - discriminant
    - nature_of_roots

- id: MATH_ALG_05
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Permutations & Combinations
  concept: Permutations

  template_variants:
    - "Find the number of permutations of {n} distinct objects taken {r} at a time."
    - "In how many ways can {r} items be arranged from {n} distinct items?"
    - "Calculate P({n}, {r})."

  variables:
    n:
      type: integer
      range: [5, 8]
    r:
      type: integer
      range: [2, 4]

  constraints:
    steps: 1
    expected_time_sec: 45
    r_less_than_n: true

  formula: "P(n,r) = n! / (n-r)!"
  answer_unit: dimensionless
  solution_template: "P({n},{r}) = {n}!/({n}-{r})! = {n}!/{n_minus_r}! = {answer}"

  difficulty_level: easy
  difficulty_factors:
    - factorial
    - single_formula

  options:
    count: 4
    distractor_strategy:
      - formula: "n! / (r! × (n-r)!)"
        error_type: used_combination
      - formula: "n × r"
        error_type: simple_multiplication
      - formula: "n!"
        error_type: ignored_r

  tags:
    - permutations
    - factorial
    - counting

- id: MATH_ALG_06
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Permutations & Combinations
  concept: Combinations

  template_variants:
    - "Find the number of combinations of {n} objects taken {r} at a time."
    - "Calculate C({n}, {r})."
    - "In how many ways can {r} items be selected from {n} distinct items?"

  variables:
    n:
      type: integer
      range: [5, 10]
    r:
      type: integer
      range: [2, 4]

  constraints:
    steps: 1
    expected_time_sec: 50
    r_less_than_n: true

  formula: "C(n,r) = n! / (r! × (n-r)!)"
  answer_unit: dimensionless
  solution_template: "C({n},{r}) = {n}!/({r}! × {n_minus_r}!) = {answer}"

  difficulty_level: easy

  tags:
    - combinations
    - factorial

- id: MATH_ALG_07
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Binomial Theorem
  concept: Coefficient of term

  template_variants:
    - "Find the coefficient of x^{p} in the expansion of ({a}x + 1)^{n}."
    - "Determine the coefficient of x^{p} in ({a}x + 1)^{n}."

  variables:
    a:
      type: integer
      range: [1, 3]
    n:
      type: integer
      range: [4, 6]
    p:
      type: integer
      range: [1, 3]

  constraints:
    steps: 2
    expected_time_sec: 70

  formula: "Coefficient = C(n,p) × a^p"
  answer_unit: dimensionless
  solution_template: "Coefficient of x^{p} = C({n},{p}) × {a}^{p} = {comb} × {a_pow} = {answer}"

  difficulty_level: moderate
  difficulty_factors:
    - binomial_expansion
    - two_step

  tags:
    - binomial_theorem
    - coefficient

- id: MATH_ALG_08
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Matrices
  concept: Determinant 2x2

  template_variants:
    - "Find the determinant of the matrix [[{a}, {b}], [{c}, {d}]]."
    - "Evaluate |{a} {b}; {c} {d}|."
    - "Calculate det(A) where A = [[{a}, {b}], [{c}, {d}]]."

  variables:
    a:
      type: integer
      range: [1, 5]
    b:
      type: integer
      range: [-3, 3]
    c:
      type: integer
      range: [-3, 3]
    d:
      type: integer
      range: [1, 5]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "det = ad - bc"
  answer_unit: dimensionless
  solution_template: "det(A) = ({a})({d}) - ({b})({c}) = {ad} - {bc} = {answer}"

  difficulty_level: easy

  options:
    count: 4
    distractor_strategy:
      - formula: "a*d + b*c"
        error_type: added_instead
      - formula: "a + d - b - c"
        error_type: wrong_formula
      - formula: "a*b - c*d"
        error_type: wrong_pairs

  tags:
    - matrices
    - determinant

- id: MATH_ALG_09
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Arithmetic Progression
  concept: nth term

  template_variants:
    - "Find the {n}th term of the AP: {a}, {a_plus_d}, {a_plus_2d}, ..."
    - "In an AP with first term {a} and common difference {d}, find the {n}th term."

  variables:
    a:
      type: integer
      range: [1, 10]
    d:
      type: integer
      range: [2, 5]
    n:
      type: integer
      range: [5, 15]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "a_n = a + (n-1)d"
  answer_unit: dimensionless
  solution_template: "a_{n} = {a} + ({n}-1)×{d} = {a} + {n_minus_1_times_d} = {answer}"

  difficulty_level: easy

  tags:
    - arithmetic_progression
    - sequences

- id: MATH_ALG_10
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Geometric Progression
  concept: nth term

  template_variants:
    - "Find the {n}th term of the GP: {a}, {ar}, {ar2}, ..."
    - "In a GP with first term {a} and common ratio {r}, find the {n}th term."

  variables:
    a:
      type: integer
      range: [2, 5]
    r:
      type: integer
      range: [2, 3]
    n:
      type: integer
      range: [4, 6]

  constraints:
    steps: 1
    expected_time_sec: 45

  formula: "a_n = a × r^(n-1)"
  answer_unit: dimensionless
  solution_template: "a_{n} = {a} × {r}^({n}-1) = {a} × {r}^{n_minus_1} = {a} × {r_pow} = {answer}"

  difficulty_level: easy

  tags:
    - geometric_progression
    - sequences

