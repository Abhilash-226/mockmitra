- id: PHY_WAVE_01
  exam: TS_EAMCET
  subject: Physics
  unit: Waves and Optics
  chapter: Wave Motion
  concept: Wave velocity

  template_variants:
    - "A wave has frequency {f} Hz and wavelength {lambda} m. Find its velocity."
    - "Calculate wave velocity for f = {f} Hz and λ = {lambda} m."

  variables:
    f:
      type: integer
      range: [10, 100]
      step: 10
