# ============================================
# UNIT 5: CURRENT ELECTRICITY
# ============================================

- id: PHY_CE_01
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Ohm's Law
  concept: Basic Ohm's Law

  template_variants:
    - "A wire of resistance {R} Ω is connected to a {V} V battery. Find the current flowing through the wire."
    - "Find the current through a {R} Ω resistor connected across {V} V."
    - "A {V} V source drives current through {R} Ω resistance. Calculate the current."

  variables:
    R:
      type: integer
      range: [2, 20]
      step: 2
    V:
      type: integer
      range: [6, 24]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_integer_answer: true

  formula: "I = V/R"
  answer_unit: "A"
  solution_template: "Using Ohm's Law: I = V/R = {V}/{R} = {answer} A"

  difficulty_level: easy
  difficulty_factors:
    - single_formula
    - direct_substitution

  options:
    count: 4
    distractor_strategy:
      - formula: "V / (R + 2)"
        error_type: added_resistance
      - formula: "(V + 2) / R"
        error_type: wrong_voltage
      - formula: "V * R"
        error_type: multiplication_instead

  tags:
    - ohms_law
    - current_electricity

  source_reference:
    similar_in_years: [2018, 2020, 2022]
    frequency: high

- id: PHY_CE_02
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Resistance
  concept: Series combination

  template_variants:
    - "Three resistors of {R1} Ω, {R2} Ω and {R3} Ω are connected in series. Find the equivalent resistance."
    - "Find R_eq for {R1} Ω, {R2} Ω, {R3} Ω in series."

  variables:
    R1:
      type: integer
      range: [2, 10]
      step: 2
    R2:
      type: integer
      range: [2, 10]
      step: 2
    R3:
      type: integer
      range: [2, 10]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 30
    ensure_integer_answer: true

  formula: "R_eq = R₁ + R₂ + R₃"
  answer_unit: "Ω"
  solution_template: "R_eq = {R1} + {R2} + {R3} = {answer} Ω"

  difficulty_level: easy

  tags:
    - resistance
    - series

- id: PHY_CE_03
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Resistance
  concept: Parallel combination

  template_variants:
    - "Two resistors of {R1} Ω and {R2} Ω are connected in parallel. Find the equivalent resistance."
    - "Calculate R_eq for {R1} Ω || {R2} Ω."

  variables:
    R1:
      type: integer
      range: [2, 12]
      step: 2
    R2:
      type: integer
      range: [2, 12]
      step: 2

  constraints:
    steps: 2
    expected_time_sec: 50

  formula: "1/R_eq = 1/R₁ + 1/R₂ or R_eq = R₁R₂/(R₁+R₂)"
  answer_unit: "Ω"
  solution_template: "R_eq = ({R1}×{R2})/({R1}+{R2}) = {product}/{sum} = {answer} Ω"

  difficulty_level: easy

  tags:
    - resistance
    - parallel

- id: PHY_CE_04
  exam: TS_EAMCET
  subject: Physics
  unit: Current Electricity
  chapter: Power
  concept: Electrical power

  template_variants:
    - "Find the power dissipated in a {R} Ω resistor carrying {I} A current."
    - "Calculate power when {I} A flows through {R} Ω."

  variables:
    R:
      type: integer
      range: [2, 10]
      step: 2
    I:
      type: integer
      range: [2, 5]

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_integer_answer: true

  formula: "P = I²R"
  answer_unit: "W"
  solution_template: "P = I²R = ({I})²({R}) = {I_sq}×{R} = {answer} W"

  difficulty_level: easy

  tags:
    - power
    - current_electricity

