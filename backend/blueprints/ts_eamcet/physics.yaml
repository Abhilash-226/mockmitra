      type: integer
      range: [2, 10]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_integer_answer: true

  formula: "v = fλ"
  answer_unit: "m/s"
  solution_template: "v = fλ = ({f})({lambda}) = {answer} m/s"

  difficulty_level: easy

  tags:
    - waves
    - velocity

- id: PHY_WAVE_02
  exam: TS_EAMCET
  subject: Physics
  unit: Waves and Optics
  chapter: Sound
  concept: Frequency of string

  template_variants:
    - "Find the fundamental frequency of a string of length {L} m under tension {T} N with linear mass density {mu} kg/m."

  variables:
    L:
      type: integer
      range: [1, 2]
    T:
      type: integer
      range: [100, 400]
      step: 100
    mu:
      type: choice
      values: [0.01, 0.04]

  constraints:
    steps: 2
    expected_time_sec: 70

  formula: "f = (1/2L)√(T/μ)"
  answer_unit: "Hz"

  difficulty_level: moderate

  tags:
    - sound
    - strings

- id: PHY_WAVE_03
  exam: TS_EAMCET
  subject: Physics
  unit: Waves and Optics
  chapter: Optics
  concept: Focal length

  template_variants:
    - "A convex lens forms an image at {v} cm when object is at {u} cm. Find the focal length."
    - "For a lens, if u = {u} cm and v = {v} cm, find f."

  variables:
    u:
      type: integer
      range: [-30, -10]
      step: 5
    v:
      type: integer
      range: [10, 30]
      step: 5

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "1/f = 1/v - 1/u"
  answer_unit: "cm"
  solution_template: "1/f = 1/v - 1/u = 1/{v} - 1/{u} = 1/{v} + 1/{u_abs}. f = {answer} cm"

  difficulty_level: moderate

  tags:
    - optics
    - lenses

- id: PHY_WAVE_04
  exam: TS_EAMCET
  subject: Physics
  unit: Waves and Optics
  chapter: Optics
  concept: Mirror formula

  template_variants:
    - "A concave mirror has focal length {f} cm. Find image distance when object is at {u} cm."
    - "For a mirror with f = {f} cm and u = {u} cm, find v."

  variables:
    f:
      type: integer
      range: [-20, -10]
      step: 5
    u:
      type: integer
      range: [-30, -15]
      step: 5

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "1/v + 1/u = 1/f"
  answer_unit: "cm"

  difficulty_level: moderate

  tags:
    - optics
    - mirrors

- id: PHY_WAVE_05
  exam: TS_EAMCET
  subject: Physics
  unit: Waves and Optics
  chapter: Optics
  concept: Refractive index

  template_variants:
    - "Light travels from medium 1 (n = {n1}) to medium 2 (n = {n2}). If angle of incidence is {i}°, find angle of refraction."

  variables:
    n1:
      type: choice
      values: [1, 1.5]
    n2:
      type: choice
      values: [1.5, 1.33]
    i:
      type: choice
      values: [30, 45, 60]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "n1 sin(i) = n2 sin(r)"
  answer_unit: "degrees"

  difficulty_level: moderate

  tags:
    - optics
    - refraction

