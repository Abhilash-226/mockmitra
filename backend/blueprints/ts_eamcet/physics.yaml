- id: PHY_THERMO_01
  exam: TS_EAMCET
  subject: Physics
  unit: Thermodynamics
  chapter: Heat
  concept: Heat transfer

  template_variants:
    - "Find the heat required to raise the temperature of {m} kg of water by {dT}°C. (Specific heat = {c} J/kg°C)"
    - "Calculate heat needed to warm {m} kg water from {T1}°C to {T2}°C."

  variables:
    m:
      type: integer
      range: [1, 5]
    dT:
      type: integer
      range: [10, 50]
      step: 10
    c:
      type: integer
      range: [4200, 4200]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "Q = mcΔT"
  answer_unit: "J"
  solution_template: "Q = mcΔT = ({m})({c})({dT}) = {answer} J"

  difficulty_level: easy

  tags:
    - heat
    - calorimetry

- id: PHY_THERMO_02
  exam: TS_EAMCET
  subject: Physics
  unit: Thermodynamics
  chapter: Ideal Gas
  concept: Ideal gas law

  template_variants:
    - "A gas at {P1} atm and {V1} L is compressed to {V2} L at constant temperature. Find the final pressure."
    - "For isothermal compression from {V1} L to {V2} L at {P1} atm, find P₂."

  variables:
    P1:
      type: integer
      range: [1, 4]
    V1:
      type: integer
      range: [4, 10]
      step: 2
    V2:
      type: integer
      range: [1, 3]

  constraints:
    steps: 1
    expected_time_sec: 45

  formula: "P₁V₁ = P₂V₂"
  answer_unit: "atm"
  solution_template: "P₂ = P₁V₁/V₂ = ({P1})({V1})/{V2} = {answer} atm"

  difficulty_level: easy

  tags:
    - ideal_gas
    - isothermal

- id: PHY_THERMO_03
  exam: TS_EAMCET
  subject: Physics
  unit: Thermodynamics
  chapter: First Law
  concept: Work done by gas

  template_variants:
    - "Find work done by {n} moles of gas expanding isothermally at {T} K from {V1} L to {V2} L."

  variables:
    n:
      type: integer
      range: [1, 3]
    T:
      type: integer
      range: [300, 400]
      step: 50
    V1:
      type: integer
      range: [1, 2]
    V2:
      type: integer
      range: [4, 10]
      step: 2

  constraints:
    steps: 2
    expected_time_sec: 70

  formula: "W = nRT ln(V₂/V₁)"
  answer_unit: "J"

  difficulty_level: moderate

  tags:
    - first_law
