# TS EAMCET Physics Blueprints
# Comprehensive blueprint collection for question generation

# ============================================
# UNIT 1: MECHANICS
# ============================================

- id: PHY_MECH_01
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Units and Measurements
  concept: Dimensional formula

  template_variants:
    - "Find the dimensional formula of {quantity}."
    - "What is the dimension of {quantity}?"

  variables:
    quantity:
      type: choice
      values:
        - "velocity"
        - "acceleration"
        - "force"
        - "work"
        - "power"
        - "momentum"
        - "pressure"

  constraints:
    steps: 1
    expected_time_sec: 30

  question_type: formula_recall
  answer_type: expression
  difficulty_level: easy

  tags:
    - dimensions
    - units

- id: PHY_MECH_02
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Kinematics
  concept: Equations of motion

  template_variants:
    - "A body starts from rest and accelerates at {a} m/s². Find its velocity after {t} seconds."
    - "An object accelerates uniformly at {a} m/s² from rest. What is its speed after {t} s?"

  variables:
    a:
      type: integer
      range: [2, 10]
      step: 2
    t:
      type: integer
      range: [2, 8]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 40
    ensure_integer_answer: true

  formula: "v = u + at = 0 + at"
  answer_unit: "m/s"
  solution_template: "v = u + at = 0 + ({a})({t}) = {answer} m/s"

  difficulty_level: easy
  difficulty_factors:
    - single_formula
    - direct_substitution

  options:
    count: 4
    distractor_strategy:
      - formula: "a * t / 2"
        error_type: used_displacement_formula
      - formula: "a + t"
        error_type: added_instead
      - formula: "a * t * 2"
        error_type: doubled

  tags:
    - kinematics
    - equations_of_motion

- id: PHY_MECH_03
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Kinematics
  concept: Distance traveled

  template_variants:
    - "A car moving with initial velocity {u} m/s accelerates at {a} m/s² for {t} seconds. Find the distance covered."
    - "Find the displacement of a body with initial velocity {u} m/s and acceleration {a} m/s² after {t} seconds."

  variables:
    u:
      type: integer
      range: [0, 10]
      step: 2
    a:
      type: integer
      range: [2, 6]
      step: 2
    t:
      type: integer
      range: [2, 5]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "s = ut + ½at²"
  answer_unit: "m"
  solution_template: "s = ut + ½at² = ({u})({t}) + ½({a})({t})² = {ut} + {half_at_sq} = {answer} m"

  difficulty_level: easy

  tags:
    - kinematics
    - displacement

- id: PHY_MECH_04
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Newton's Laws
  concept: Force calculation

  template_variants:
    - "A body of mass {m} kg is accelerated at {a} m/s². Find the force applied."
    - "Calculate the force required to accelerate a {m} kg mass at {a} m/s²."

  variables:
    m:
      type: integer
      range: [2, 10]
      step: 2
    a:
      type: integer
      range: [2, 10]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_integer_answer: true

  formula: "F = ma"
  answer_unit: "N"
  solution_template: "F = ma = ({m})({a}) = {answer} N"

  difficulty_level: easy

  options:
    count: 4
    distractor_strategy:
      - formula: "m + a"
        error_type: addition_error
      - formula: "m / a"
        error_type: division_error
      - formula: "m * a / 2"
        error_type: halved

  tags:
    - newtons_laws
    - force

- id: PHY_MECH_05
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Work, Energy, Power
  concept: Work done

  template_variants:
    - "A force of {F} N displaces a body through {d} m in the direction of force. Find the work done."
    - "Calculate work done when a {F} N force moves an object {d} m."

  variables:
    F:
      type: integer
      range: [5, 20]
      step: 5
    d:
      type: integer
      range: [2, 10]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 35
    ensure_integer_answer: true

  formula: "W = Fd"
  answer_unit: "J"
  solution_template: "W = Fd = ({F})({d}) = {answer} J"

  difficulty_level: easy

  tags:
    - work
    - energy

- id: PHY_MECH_06
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Work, Energy, Power
  concept: Kinetic energy

  template_variants:
    - "Find the kinetic energy of a body of mass {m} kg moving with velocity {v} m/s."
    - "Calculate KE of a {m} kg object moving at {v} m/s."

  variables:
    m:
      type: integer
      range: [2, 10]
      step: 2
    v:
      type: integer
      range: [2, 10]
      step: 2

  constraints:
    steps: 1
    expected_time_sec: 40
    ensure_integer_answer: true

  formula: "KE = ½mv²"
  answer_unit: "J"
  solution_template: "KE = ½mv² = ½({m})({v})² = ½({m})({v_sq}) = {answer} J"

  difficulty_level: easy

  tags:
    - kinetic_energy
    - mechanics

- id: PHY_MECH_07
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Gravitation
  concept: Gravitational force

  template_variants:
    - "Find the acceleration due to gravity at height h equal to {n} times the radius of Earth (g on surface = {g} m/s²)."
    - "At what height h = {n}R, find g if g₀ = {g} m/s²."

  variables:
    n:
      type: integer
      range: [1, 3]
    g:
      type: integer
      range: [10, 10]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "g' = g/(1+h/R)² = g/(1+n)²"
  answer_unit: "m/s²"
  solution_template: "g' = g/(1+n)² = {g}/(1+{n})² = {g}/{denom} = {answer} m/s²"

  difficulty_level: moderate

  tags:
    - gravitation
    - acceleration

- id: PHY_MECH_08
  exam: TS_EAMCET
  subject: Physics
  unit: Mechanics
  chapter: Rotational Motion
  concept: Moment of inertia

  template_variants:
    - "Find the moment of inertia of a ring of mass {m} kg and radius {r} m about its axis."
    - "Calculate I for a ring (M = {m} kg, R = {r} m) about perpendicular axis through center."

  variables:
    m:
      type: integer
      range: [2, 10]
      step: 2
    r:
      type: integer
      range: [1, 5]

  constraints:
    steps: 1
    expected_time_sec: 35

  formula: "I = MR²"
  answer_unit: "kg⋅m²"
  solution_template: "I = MR² = ({m})({r})² = ({m})({r_sq}) = {answer} kg⋅m²"

  difficulty_level: easy

  tags:
    - rotational_motion
    - moment_of_inertia

# ============================================
# UNIT 2: WAVES AND OPTICS
