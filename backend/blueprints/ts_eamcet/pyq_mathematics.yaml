# ============================================
# PROBABILITY
# ============================================

- id: PYQ_MATH_PROB_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Probability
  chapter: Basic Probability
  concept: Addition theorem

  template_variants:
    - "If P(A) = {pa}, P(B) = {pb}, P(A∩B) = {pab}, find P(A∪B)."
    - "Calculate P(A∪B) given P(A) = {pa}, P(B) = {pb}, P(A∩B) = {pab}."

  variables:
    pa:
      type: choice
      values: [0.3, 0.4, 0.5, 0.6]
    pb:
      type: choice
      values: [0.4, 0.5, 0.6, 0.7]
    pab:
      type: choice
      values: [0.1, 0.2, 0.3]

  constraints:
    steps: 1
    expected_time_sec: 35

  formula: "P(A∪B) = P(A) + P(B) - P(A∩B)"
  answer_unit: ""
  solution_template: "P(A∪B) = {pa} + {pb} - {pab} = {answer}"

  difficulty_level: easy

  tags:
    - probability
    - addition_theorem

- id: PYQ_MATH_PROB_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Probability
  chapter: Basic Probability
  concept: Conditional probability

  template_variants:
    - "If P(A) = {pa}, P(B) = {pb}, P(A∩B) = {pab}, find P(A|B)."
    - "Calculate P(A|B) given P(A) = {pa}, P(B) = {pb}, P(A∩B) = {pab}."

  variables:
    pa:
      type: choice
      values: [0.4, 0.5, 0.6]
    pb:
      type: choice
      values: [0.5, 0.6, 0.8]
    pab:
      type: choice
      values: [0.2, 0.3, 0.4]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "P(A|B) = P(A∩B)/P(B)"
  answer_unit: ""
  solution_template: "P(A|B) = P(A∩B)/P(B) = {pab}/{pb} = {answer}"

  difficulty_level: easy

  tags:
    - probability
    - conditional_probability
