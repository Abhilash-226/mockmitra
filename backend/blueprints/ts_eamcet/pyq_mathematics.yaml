# ============================================
# PERMUTATIONS AND COMBINATIONS
# ============================================

- id: PYQ_MATH_PnC_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Permutations and Combinations
  concept: nPr formula

  template_variants:
    - "Find the value of ⁿP_r when n = {n} and r = {r}."
    - "Calculate {n}P{r}."

  variables:
    n:
      type: integer
      range: [5, 10]
    r:
      type: integer
      range: [2, 4]

  constraints:
    steps: 2
    expected_time_sec: 50
    r_less_than_n: true

  formula: "nPr = n!/(n-r)!"
  answer_unit: ""
  solution_template: "{n}P{r} = {n}!/({n}-{r})! = {answer}"

  difficulty_level: easy

  tags:
    - permutations
    - factorial

- id: PYQ_MATH_PnC_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Permutations and Combinations
  concept: nCr formula

  template_variants:
    - "Find the value of ⁿC_r when n = {n} and r = {r}."
    - "Calculate C({n}, {r})."

  variables:
    n:
      type: integer
      range: [6, 12]
    r:
      type: integer
      range: [2, 5]

  constraints:
    steps: 2
    expected_time_sec: 50
    r_less_than_n: true

  formula: "nCr = n!/[r!(n-r)!]"
