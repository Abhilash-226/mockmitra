# ============================================
# MATRICES - From 2024 PYQ
# ============================================

- id: PYQ_MATH_MAT_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Matrices
  concept: Matrix equations
  pyq_year: 2024

  template_variants:
    - "If A is a square matrix and A² + I = {k}A, then A⁴ ="
    - "For a square matrix A satisfying A² + I = {k}A, find A⁴."

  variables:
    k:
      type: integer
      range: [2, 5]

  constraints:
    steps: 3
    expected_time_sec: 90

  formula: "From A² = kA - I, compute A⁴ = (kA-I)² = k²A² - 2kA + I = k²(kA-I) - 2kA + I"
  answer_type: expression
  difficulty_level: moderate

  tags:
    - matrices
    - matrix_equations
    - pyq_2024

- id: PYQ_MATH_MAT_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Matrices
  concept: Trace and determinant

  template_variants:
    - "If A is a 2×2 matrix with trace {tr} and determinant {det}, find trace(A²)."
    - "For a 2×2 matrix A with Tr(A) = {tr} and |A| = {det}, find Tr(A²)."

  variables:
    tr:
      type: integer
      range: [2, 6]
    det:
      type: integer
      range: [1, 8]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "Tr(A²) = Tr(A)² - 2|A| = tr² - 2*det"
  answer_unit: ""
  solution_template: "Tr(A²) = (Tr(A))² - 2|A| = {tr}² - 2({det}) = {answer}"

  difficulty_level: easy

  tags:
    - matrices
    - trace
    - determinant

# ============================================
# QUADRATIC EQUATIONS - From 2024 PYQ
# ============================================

- id: PYQ_MATH_QUAD_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Quadratic Equations
  concept: Equal roots condition
  pyq_year: 2024

  template_variants:
    - "If the quadratic equation {a}x² + ({b}k + {c})x - {d}k = 0 has real and equal roots, find k."
    - "Find k if {a}x² + ({b}k + {c})x - {d}k = 0 has equal roots."

  variables:
    a:
      type: integer
      range: [2, 5]
    b:
      type: integer
      range: [2, 4]
    c:
      type: integer
      range: [1, 3]
    d:
      type: integer
      range: [3, 7]

  constraints:
    steps: 3
    expected_time_sec: 90

  formula: "For equal roots: D = 0, i.e., (bk+c)² + 4*a*d*k = 0"
  answer_type: expression
  difficulty_level: moderate

  tags:
    - quadratic_equations
    - discriminant
    - pyq_2024

- id: PYQ_MATH_QUAD_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Quadratic Equations
  concept: Sum and product of roots

  template_variants:
    - "If α and β are roots of x² - {p}x + {q} = 0, find α² + β²."
    - "For the equation x² - {p}x + {q} = 0 with roots α, β, find α² + β²."

  variables:
    p:
      type: integer
      range: [3, 8]
    q:
      type: integer
      range: [2, 10]

  constraints:
    steps: 2
    expected_time_sec: 50

  formula: "α² + β² = (α + β)² - 2αβ = p² - 2q"
  answer_unit: ""
  solution_template: "α + β = {p}, αβ = {q}. α² + β² = {p}² - 2({q}) = {answer}"

  difficulty_level: easy

  tags:
    - quadratic_equations
    - roots
    - vietas_formulas

