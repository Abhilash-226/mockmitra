- id: PYQ_MATH_CALC_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Calculus
  chapter: Applications of Derivatives
  concept: Velocity and displacement
  pyq_year: 2024

  template_variants:
    - "A particle moves along a straight line with S = t³ - {a}t² - {b}t + {c}. Find distance when particle comes to rest."
    - "If S = t³ - {a}t² - {b}t + {c} metres, find the distance when velocity becomes zero."

  variables:
    a:
      type: integer
      range: [1, 3]
    b:
      type: integer
      range: [1, 5]
    c:
      type: integer
      range: [2, 6]

  constraints:
    steps: 3
    expected_time_sec: 90

  formula: "v = dS/dt = 3t² - 2at - b = 0, solve for t, substitute in S"
  answer_unit: "m"
  difficulty_level: moderate

  tags:
    - calculus
    - applications_derivatives
    - kinematics
    - pyq_2024

