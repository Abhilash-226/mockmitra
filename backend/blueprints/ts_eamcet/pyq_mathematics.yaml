- id: PYQ_MATH_COORD_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
  chapter: Straight Lines
  concept: Distance between points

  template_variants:
    - "Find the distance between points ({x1}, {y1}) and ({x2}, {y2})."
    - "Calculate the distance from A({x1}, {y1}) to B({x2}, {y2})."

  variables:
    x1:
      type: integer
      range: [-5, 5]
    y1:
      type: integer
      range: [-5, 5]
    x2:
      type: integer
      range: [-5, 10]
    y2:
      type: integer
      range: [-5, 10]

  constraints:
    steps: 2
    expected_time_sec: 45

  formula: "d = √[(x2-x1)² + (y2-y1)²]"
  answer_unit: "units"
  solution_template: "d = √[({x2}-{x1})² + ({y2}-{y1})²] = √[{dx}² + {dy}²] = {answer}"

  difficulty_level: easy

  tags:
    - coordinate_geometry
    - distance_formula

- id: PYQ_MATH_COORD_02
  exam: TS_EAMCET
  subject: Mathematics
