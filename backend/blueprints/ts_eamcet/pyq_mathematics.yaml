# ============================================
# TRIGONOMETRY
# ============================================

- id: PYQ_MATH_TRIG_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Trigonometry
  chapter: Trigonometric Functions
  concept: Basic identities

  template_variants:
    - "If sin θ = {num}/{den}, find cos θ (θ in first quadrant)."
    - "Given sin θ = {num}/{den} where 0 < θ < π/2, find cos θ."

  variables:
    ratio_data:
      type: choice
      values:
        - { num: 3, den: 5, cos: "4/5" }
        - { num: 5, den: 13, cos: "12/13" }
        - { num: 8, den: 17, cos: "15/17" }
        - { num: 7, den: 25, cos: "24/25" }
        - { num: 12, den: 13, cos: "5/13" }

  constraints:
    steps: 2
    expected_time_sec: 45

  formula: "cos²θ = 1 - sin²θ, cos θ = √(1 - (num/den)²)"
  answer_type: fraction
  difficulty_level: easy

  tags:
    - trigonometry
    - pythagorean_identity

- id: PYQ_MATH_TRIG_02
  exam: TS_EAMCET
  subject: Mathematics
  unit: Trigonometry
  chapter: Trigonometric Equations
  concept: General solutions

  template_variants:
    - "Find the general solution of sin x = {val}."
    - "Solve: sin x = {val}."

  variables:
    trig_data:
      type: choice
      values:
        - { val: "1/2", solution: "x = nπ + (-1)ⁿ(π/6)" }
        - { val: "√3/2", solution: "x = nπ + (-1)ⁿ(π/3)" }
        - { val: "1/√2", solution: "x = nπ + (-1)ⁿ(π/4)" }
        - { val: "0", solution: "x = nπ" }
        - { val: "1", solution: "x = 2nπ + π/2" }

  constraints:
    steps: 1
    expected_time_sec: 40

  question_type: formula_recall
  answer_type: expression
  difficulty_level: easy

  tags:
    - trigonometry
    - general_solutions

