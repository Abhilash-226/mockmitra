  variables:
    x1:
      type: integer
      range: [1, 5]
    y1:
      type: integer
      range: [1, 6]
    x2:
      type: integer
      range: [3, 10]
    y2:
      type: integer
      range: [2, 12]

  constraints:
    steps: 1
    expected_time_sec: 35

  formula: "m = (y2 - y1)/(x2 - x1)"
  answer_unit: ""
  solution_template: "m = ({y2} - {y1})/({x2} - {x1}) = {answer}"

  difficulty_level: easy

  tags:
    - coordinate_geometry
    - slope

- id: PYQ_MATH_COORD_03
  exam: TS_EAMCET
  subject: Mathematics
  unit: Coordinate Geometry
