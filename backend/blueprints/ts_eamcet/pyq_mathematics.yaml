- id: PYQ_MATH_SEQ_01
  exam: TS_EAMCET
  subject: Mathematics
  unit: Algebra
  chapter: Sequences and Series
  concept: AP sum

  template_variants:
    - "Find the sum of first {n} terms of AP: {a}, {a_plus_d}, {a_plus_2d}, ..."
    - "For AP with first term {a} and common difference {d}, find S_{n}."

  variables:
    a:
      type: integer
      range: [2, 10]
    d:
      type: integer
      range: [2, 6]
    n:
      type: integer
      range: [10, 25]

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "Sn = (n/2)[2a + (n-1)d]"
  answer_unit: ""
  solution_template: "S = ({n}/2)[2({a}) + ({n}-1)({d})] = {answer}"

  difficulty_level: easy

  tags:
    - sequences
    - arithmetic_progression
    - sum

- id: PYQ_MATH_SEQ_02
