- id: CHEM_PC_04
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Solutions
  concept: Molarity

  template_variants:
    - "Calculate the molarity of a solution containing {g} g of {compound} (M = {M}) in {V} mL of solution."
    - "Find M when {g} g of {compound} (molar mass = {M}) is dissolved in {V} mL."

  variables:
    g:
      type: integer
      range: [4, 20]
      step: 4
    M:
      type: integer
      range: [40, 100]
      step: 20
    V:
      type: integer
      range: [100, 500]
      step: 100
    compound:
      type: choice
      values: ["NaOH", "HCl", "H₂SO₄", "NaCl"]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "M = (g/M) / (V/1000) = (g × 1000) / (M × V)"
  answer_unit: "M"
  solution_template: "Molarity = (g/molar mass) / (V in L) = ({g}/{M}) / ({V}/1000) = {answer} M"

  difficulty_level: easy

  tags:
    - solutions
    - molarity

- id: CHEM_PC_05
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Solutions
  concept: Molality

  template_variants:
    - "Find the molality when {g} g of solute (M = {M}) is dissolved in {w} g of water."
    - "Calculate molality: {g} g solute (molar mass {M}) in {w} g solvent."

  variables:
    g:
      type: integer
      range: [5, 20]
      step: 5
    M:
      type: integer
      range: [40, 100]
      step: 20
    w:
      type: integer
      range: [100, 500]
      step: 100

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "m = (g/M) / (w/1000)"
  answer_unit: "m"

  difficulty_level: easy

  tags:
    - solutions
    - molality

- id: CHEM_PC_06
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Chemical Kinetics
  concept: Rate constant units

  template_variants:
    - "What are the units of rate constant for a {n}th order reaction?"
    - "Find the units of k for order = {n}."

  variables:
    n:
      type: integer
      range: [0, 3]

  constraints:
    steps: 1
    expected_time_sec: 35

  formula: "Units = (concentration)^(1-n) × time⁻¹"
  answer_type: expression
  difficulty_level: easy

  tags:
    - chemical_kinetics
    - rate_constant

- id: CHEM_PC_07
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Chemical Kinetics
  concept: Half-life first order

  template_variants:
    - "For a first-order reaction with k = {k} s⁻¹, find the half-life."
    - "Calculate t₁/₂ when rate constant is {k} s⁻¹ for first-order reaction."

  variables:
    k:
      type: choice
      values: [0.0693, 0.693, 0.1386]

  constraints:
    steps: 1
    expected_time_sec: 40

  formula: "t₁/₂ = 0.693/k"
  answer_unit: "s"
  solution_template: "t₁/₂ = 0.693/{k} = {answer} s"

  difficulty_level: easy

  tags:
    - chemical_kinetics
    - half_life

- id: CHEM_PC_08
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Electrochemistry
  concept: Cell EMF

  template_variants:
    - "Calculate the EMF of a cell with E°(cathode) = {Ec} V and E°(anode) = {Ea} V."
    - "Find E°cell when E°cathode = {Ec} V and E°anode = {Ea} V."

  variables:
    Ec:
      type: choice
      values: [0.80, 0.34, 1.36]
    Ea:
      type: choice
      values: [-0.76, -0.44, -2.37]

  constraints:
    steps: 1
    expected_time_sec: 35

  formula: "E°cell = E°cathode - E°anode"
  answer_unit: "V"
  solution_template: "E°cell = {Ec} - ({Ea}) = {Ec} + {Ea_abs} = {answer} V"

  difficulty_level: easy

  tags:
    - electrochemistry
    - cell_potential

- id: CHEM_PC_09
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Electrochemistry
  concept: Faraday's law

  template_variants:
    - "Calculate the mass of {element} deposited when {Q} C of charge is passed. (Atomic mass = {A}, valency = {n})"
    - "Find mass deposited: Q = {Q} C, A = {A}, n = {n}."

  variables:
    Q:
      type: integer
      range: [965, 9650]
      step: 965
    A:
      type: integer
      range: [27, 108]
    n:
      type: integer
      range: [1, 3]
    element:
      type: choice
      values: ["copper", "silver", "aluminum"]

  constraints:
    steps: 2
    expected_time_sec: 60

  formula: "m = (Q × A) / (n × F) where F = 96500 C/mol"
  answer_unit: "g"

  difficulty_level: moderate

  tags:
    - electrochemistry
    - faradays_law

- id: CHEM_PC_10
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Thermodynamics
  concept: Enthalpy

  template_variants:
    - "For a reaction with ΔH = {dH} kJ and ΔS = {dS} J/K at {T} K, find ΔG."
    - "Calculate ΔG: ΔH = {dH} kJ, ΔS = {dS} J/K, T = {T} K."

  variables:
    dH:
      type: integer
      range: [-100, 100]
      step: 50
    dS:
      type: integer
      range: [-200, 200]
      step: 100
    T:
      type: integer
      range: [298, 400]
      step: 51

  constraints:
    steps: 2
    expected_time_sec: 55

  formula: "ΔG = ΔH - TΔS (convert units!)"
  answer_unit: "kJ"
  solution_template: "ΔG = ΔH - TΔS = {dH} - ({T})({dS}/1000) = {dH} - {TdS} = {answer} kJ"

  difficulty_level: moderate

  tags:
    - thermodynamics
    - gibbs_energy

