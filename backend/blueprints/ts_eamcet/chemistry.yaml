# TS EAMCET Chemistry Blueprints
# Comprehensive blueprint collection for question generation

# ============================================
# PHYSICAL CHEMISTRY
# ============================================

- id: CHEM_PC_01
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Atomic Structure
  concept: Electronic configuration

  template_variants:
    - "Write the electronic configuration of {element} (Z = {z})."
    - "Find the electronic configuration of element with atomic number {z}."

  variables:
    element_data:
      type: choice
      values:
        - { element: "Na", z: 11, config: "1s² 2s² 2p⁶ 3s¹" }
        - { element: "Fe", z: 26, config: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶" }
        - { element: "Cu", z: 29, config: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d¹⁰" }
        - { element: "Zn", z: 30, config: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰" }

  constraints:
    steps: 1
    expected_time_sec: 45

  question_type: recall
  answer_type: expression
  difficulty_level: easy

  tags:
    - atomic_structure
    - electronic_configuration

- id: CHEM_PC_02
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Atomic Structure
  concept: Quantum numbers

  template_variants:
    - "For n = {n}, find the maximum number of electrons."
    - "Calculate the maximum electrons in shell with principal quantum number {n}."

  variables:
    n:
      type: integer
      range: [1, 4]

  constraints:
    steps: 1
    expected_time_sec: 30

  formula: "Max electrons = 2n²"
  answer_unit: "electrons"
  solution_template: "Max = 2n² = 2({n})² = 2×{n_sq} = {answer}"

  difficulty_level: easy

  tags:
    - quantum_numbers
    - atomic_structure

- id: CHEM_PC_03
  exam: TS_EAMCET
  subject: Chemistry
  unit: Physical Chemistry
  chapter: Chemical Bonding
  concept: Hybridization

  template_variants:
