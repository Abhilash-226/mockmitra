        <h1>MockMitra - AI Mock Test Generator for Competitive Exams</h1>
        <p><strong>MockMitra</strong> is an AI-powered <strong>CBT (Computer Based Test) mock test platform</strong> for Indian competitive exams. It is NOT an interview preparation platform. MockMitra helps students practice for government and competitive exams with realistic exam simulations.</p>

        <h2>About MockMitra</h2>
        <p>MockMitra is a free, AI-powered mock test platform that provides realistic Computer Based Test (CBT) simulations for Indian competitive exams. Students can practice with AI-generated question papers, replay Previous Year Questions (PYQs), and track their performance with detailed analytics.</p>

        <h2>Supported Exams</h2>
        <ul>
          <li><strong>TS EAPCET</strong> (formerly TS EAMCET) - Telangana State Engineering, Agriculture and Pharmacy Common Entrance Test</li>
          <li><strong>SSC CGL</strong> - Staff Selection Commission Combined Graduate Level</li>
          <li><strong>SSC CHSL</strong> - Staff Selection Commission Combined Higher Secondary Level</li>
          <li><strong>IBPS PO</strong> - Institute of Banking Personnel Selection Probationary Officer</li>
          <li><strong>IBPS Clerk</strong> - Institute of Banking Personnel Selection Clerk</li>
          <li><strong>RRB NTPC</strong> - Railway Recruitment Board Non-Technical Popular Categories</li>
          <li><strong>SBI PO</strong> - State Bank of India Probationary Officer</li>
        </ul>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Realistic CBT Experience</strong> — Practice on an interface that mirrors the actual exam environment</li>
          <li><strong>AI-Generated Questions</strong> — Question papers generated using AI based on real exam blueprints and patterns</li>
          <li><strong>PYQ Replay Mode</strong> — Practice with Previous Year Question papers in a timed exam setting</li>
          <li><strong>Precision Timers</strong> — Section-wise and overall timers that work exactly like the real exam</li>
          <li><strong>Detailed Analytics</strong> — In-depth performance analysis to identify strengths and weaknesses</li>
          <li><strong>Customizable Tests</strong> — Choose topics, difficulty level, and test duration as per your needs</li>
        </ul>

        <h2>Why Choose MockMitra?</h2>
        <p>MockMitra is India's most realistic CBT mock test platform. Unlike interview preparation tools, MockMitra is specifically designed for competitive exam aspirants who want to practice in an environment that exactly replicates their actual exam. With AI-generated questions following real exam blueprints and previous year question replay, MockMitra helps you practice smarter and score higher.</p>
